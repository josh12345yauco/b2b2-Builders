<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Leads — B2B2 Builders Admin</title>
<link rel="icon" href="/Images/favicon.png">
<style>
  :root {
    --ink: #16181D; --paper: #FDFDFC; --surface: #FFFFFF; --line: #E6E7EA;
    --blue: #1B66E0; --orange: #F26419; --muted: #5C6470;
    --radius: 14px;
    --shadow: 0 10px 30px -12px rgba(22,24,29,.12);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Raleway", -apple-system, "Segoe UI", sans-serif;
    background: var(--paper); color: var(--ink); min-height: 100vh;
  }
  .hidden { display: none !important; }

  /* ---------- login ---------- */
  #login-view {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #16181D;
  }
  .login-card {
    background: var(--surface); border-radius: var(--radius); padding: 44px 40px;
    width: min(380px, 90vw); text-align: center; box-shadow: var(--shadow);
  }
  .login-card img { height: 44px; margin-bottom: 18px; filter: invert(1) hue-rotate(180deg) saturate(0); }
  .login-card h1 { font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 6px; }
  .login-card p { color: var(--muted); font-size: .88rem; margin-bottom: 22px; }
  .login-card input {
    width: 100%; padding: 13px 16px; font-size: 1.2rem; text-align: center; letter-spacing: .5em;
    border: 1.5px solid var(--line); border-radius: 10px; outline: none; font-family: inherit;
  }
  .login-card input:focus { border-color: var(--orange); }
  .login-card button {
    width: 100%; margin-top: 14px; padding: 13px; font-size: .95rem; font-weight: 700;
    letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--orange);
    border: 0; border-radius: 10px; cursor: pointer; font-family: inherit;
  }
  .login-card button:hover { background: #d8570f; }
  .login-error { color: #c92a2a; font-size: .85rem; margin-top: 12px; min-height: 1.2em; }

  /* ---------- dashboard chrome ---------- */
  header.bar {
    background: var(--ink); color: #fff; padding: 14px clamp(16px, 4vw, 40px);
    display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 10;
  }
  header.bar img { height: 34px; }
  header.bar .title { font-weight: 700; letter-spacing: .1em; text-transform: uppercase; font-size: .85rem; }
  header.bar .spacer { flex: 1; }
  header.bar button, header.bar a.btn {
    background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3);
    padding: 8px 14px; border-radius: 8px; font-size: .8rem; cursor: pointer;
    font-family: inherit; text-decoration: none; font-weight: 600;
  }
  header.bar button:hover, header.bar a.btn:hover { border-color: var(--orange); color: var(--orange); }

  main { padding: clamp(16px, 4vw, 40px); max-width: 1240px; margin: 0 auto; }

  /* ---------- stats ---------- */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: var(--shadow);
  }
  .stat .n { font-size: 1.9rem; font-weight: 800; }
  .stat .l { color: var(--muted); font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
  .stat.s-new .n { color: var(--orange); }
  .stat.s-won .n { color: #2b8a3e; }
  .stat.s-calls .n { color: var(--blue); }

  /* ---------- projects manager ---------- */
  .proj-row {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 10px 16px 10px 10px; cursor: grab; user-select: none;
  }
  .proj-row.dragging { opacity: .4; }
  .proj-row.drop-above { box-shadow: 0 -3px 0 0 var(--orange), var(--shadow); }
  .proj-row.drop-below { box-shadow: 0 3px 0 0 var(--orange), var(--shadow); }
  .proj-grip { color: var(--muted); flex: none; letter-spacing: 2px; font-size: 1rem; padding: 0 2px; }
  .proj-thumb { width: 84px; height: 54px; object-fit: cover; border-radius: 8px; flex: none; background: #eee; }
  .proj-name { font-weight: 700; font-size: .95rem; }
  .proj-meta { color: var(--muted); font-size: .8rem; }
  .proj-open { margin-left: auto; border: 1.5px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 13px; font-family: inherit; font-size: .8rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .proj-open:hover { border-color: var(--ink); }
  .drag-hint { color: var(--muted); font-size: .82rem; margin: 0 0 12px; }

  /* project detail */
  .proj-detail-head { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
  .proj-detail-head h2 { font-size: 1.25rem; }
  .back-btn { border: 1.5px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-family: inherit; font-size: .82rem; font-weight: 700; cursor: pointer; }
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .media-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); position: relative; }
  .media-tile img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .media-tile .vid-badge {
    position: absolute; top: 8px; left: 8px; background: rgba(22,24,29,.75); color: #fff;
    font-size: .66rem; font-weight: 800; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px;
  }
  .media-tile .feat-badge {
    position: absolute; top: 8px; right: 8px; background: var(--orange); color: #fff;
    font-size: .66rem; font-weight: 800; letter-spacing: .08em; padding: 3px 8px; border-radius: 6px;
  }
  .media-tile .tile-actions { padding: 10px 12px; }
  .media-tile .tile-actions button {
    width: 100%; border: 1.5px solid var(--line); background: #fff; border-radius: 8px;
    padding: 7px; font-family: inherit; font-size: .78rem; font-weight: 700; cursor: pointer;
  }
  .media-tile .tile-actions button:hover:not(:disabled) { border-color: var(--orange); color: var(--orange); }
  .media-tile .tile-actions button:disabled { opacity: .45; cursor: default; }
  .upload-tile {
    border: 2px dashed var(--line); border-radius: var(--radius); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px; color: var(--muted); cursor: pointer;
    min-height: 170px; background: transparent; font-family: inherit; font-size: .85rem; font-weight: 600;
  }
  .upload-tile:hover { border-color: var(--orange); color: var(--orange); }
  .upload-tile .plus { font-size: 1.8rem; line-height: 1; }
  #publish-btn { background: var(--orange); border-color: var(--orange); }
  #publish-btn:hover { color: #fff; opacity: .9; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 10px;
    font-size: .88rem; z-index: 50; box-shadow: var(--shadow); max-width: 90vw;
  }

  /* call log rows */
  .call-row {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 20px;
  }
  .call-icon {
    width: 34px; height: 34px; border-radius: 50%; background: #e7f0fe; color: var(--blue);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .call-label { font-weight: 700; font-size: .92rem; }
  .call-page { color: var(--muted); font-size: .84rem; }
  .call-when { margin-left: auto; color: var(--muted); font-size: .78rem; white-space: nowrap; }

  /* ---------- filters ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; align-items: center; }
  .chip {
    border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 7px 16px; font-size: .82rem; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .toolbar input[type="search"] {
    margin-left: auto; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 10px;
    font-family: inherit; font-size: .88rem; width: min(260px, 100%); outline: none;
  }
  .toolbar input[type="search"]:focus { border-color: var(--orange); }

  /* ---------- lead cards ---------- */
  .lead-list { display: flex; flex-direction: column; gap: 12px; }
  .lead {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .lead-head {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer;
    flex-wrap: wrap;
  }
  .lead-head:hover { background: #fafafa; }
  .badge {
    font-size: .68rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; white-space: nowrap;
  }
  .badge.new { background: #fff0e6; color: #d8570f; }
  .badge.contacted { background: #e7f0fe; color: var(--blue); }
  .badge.won { background: #e6f7eb; color: #2b8a3e; }
  .badge.archived { background: #f1f3f5; color: var(--muted); }
  .src {
    font-size: .7rem; color: var(--muted); letter-spacing: .05em; text-transform: uppercase;
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; white-space: nowrap;
  }
  .lead-name { font-weight: 700; font-size: 1rem; }
  .lead-quick { color: var(--muted); font-size: .86rem; }
  .lead-when { margin-left: auto; color: var(--muted); font-size: .78rem; white-space: nowrap; }
  .lead-body { border-top: 1px solid var(--line); padding: 18px 20px; background: #fcfcfb; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 24px; }
  .kv div .k { font-size: .68rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .kv div .v { font-size: .92rem; font-weight: 600; overflow-wrap: anywhere; }
  .kv div .v a { color: var(--blue); text-decoration: none; }
  .lead-notes { margin-top: 14px; font-size: .92rem; line-height: 1.55; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .lead-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .lead-actions button {
    padding: 8px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff;
    font-family: inherit; font-size: .8rem; font-weight: 700; cursor: pointer;
  }
  .lead-actions button:hover { border-color: var(--ink); }
  .lead-actions button.danger { color: #c92a2a; margin-left: auto; }
  .lead-actions button.danger:hover { border-color: #c92a2a; }

  .empty {
    text-align: center; color: var(--muted); padding: 70px 20px; background: var(--surface);
    border: 1.5px dashed var(--line); border-radius: var(--radius);
  }
  .empty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 6px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view">
  <form class="login-card" id="login-form">
    <img src="/Images/logo-b2b2.png" alt="B2B2 Builders">
    <h1>Leads Admin</h1>
    <p>Enter the admin password to continue.</p>
    <input type="password" id="pw" inputmode="numeric" autocomplete="current-password" autofocus aria-label="Password">
    <button type="submit">Unlock</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dash-view" class="hidden">
  <header class="bar">
    <img src="/Images/logo-b2b2.png" alt="">
    <span class="title">Leads</span>
    <span class="spacer"></span>
    <button id="publish-btn" type="button">Publish to Live Site</button>
    <a class="btn" href="/api/admin/export.csv">Export CSV</a>
    <button id="refresh-btn" type="button">Refresh</button>
    <button id="logout-btn" type="button">Log out</button>
  </header>
  <main>
    <div class="stats" id="stats"></div>
    <div class="toolbar" id="toolbar">
      <button class="chip" data-f="all" aria-pressed="true" type="button">All</button>
      <button class="chip" data-f="new" aria-pressed="false" type="button">New</button>
      <button class="chip" data-f="contacted" aria-pressed="false" type="button">Contacted</button>
      <button class="chip" data-f="won" aria-pressed="false" type="button">Won</button>
      <button class="chip" data-f="archived" aria-pressed="false" type="button">Archived</button>
      <button class="chip" data-f="calls" aria-pressed="false" type="button">📞 Call Clicks</button>
      <button class="chip" data-f="projects" aria-pressed="false" type="button">🏗️ Projects</button>
      <input type="search" id="search" placeholder="Search name, phone, email…" aria-label="Search leads">
    </div>
    <div class="lead-list" id="lead-list"></div>
  </main>
</div>

<script>
(function () {
  'use strict';
  var leads = [];
  var calls = [];
  var projects = [];
  var openProject = null; // full project object when viewing detail
  var filter = 'all';
  var query = '';
  var openId = null;

  var $ = function (id) { return document.getElementById(id); };

  var FIELD_LABELS = {
    phone: 'Phone', email: 'Email', projectType: 'Project type', projectSize: 'Size',
    propertyType: 'Property', ownership: 'Ownership', timeline: 'Timeline', budget: 'Budget',
    location: 'Location', zip: 'ZIP', area: 'Area', contactPref: 'Prefers', page: 'Submitted from'
  };
  var SOURCE_LABELS = {
    'project-builder': 'Project Builder',
    'contact-page-form': 'Contact Form',
    'area-landing-form': 'Area Page'
  };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fmtWhen(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return '';
    return d.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) +
      ' · ' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }

  /* ---------- rendering ---------- */
  function renderStats() {
    var counts = { total: leads.length, new: 0, contacted: 0, won: 0 };
    leads.forEach(function (l) { if (counts[l.status] != null) counts[l.status]++; });
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var callsToday = calls.filter(function (c) { return new Date(c.clickedAt) >= today; }).length;
    $('stats').innerHTML =
      '<div class="stat"><div class="n">' + counts.total + '</div><div class="l">Total leads</div></div>' +
      '<div class="stat s-new"><div class="n">' + counts.new + '</div><div class="l">New</div></div>' +
      '<div class="stat"><div class="n">' + counts.contacted + '</div><div class="l">Contacted</div></div>' +
      '<div class="stat s-won"><div class="n">' + counts.won + '</div><div class="l">Won</div></div>' +
      '<div class="stat s-calls"><div class="n">' + calls.length + '</div><div class="l">Call clicks' +
      (callsToday ? ' · ' + callsToday + ' today' : '') + '</div></div>';
  }

  function renderCalls() {
    var visible = calls.filter(function (c) {
      if (!query) return true;
      return (c.page + ' ' + c.label).toLowerCase().indexOf(query) !== -1;
    });
    if (!visible.length) {
      $('lead-list').innerHTML =
        '<div class="empty"><strong>No call clicks yet</strong>' +
        'Every tap on the call button or phone number 215-888-4384 anywhere on the site will show up here.</div>';
      return;
    }
    $('lead-list').innerHTML = visible.map(function (c) {
      return '<div class="call-row">' +
        '<span class="call-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></span>' +
        '<span class="call-label">' + esc(c.label || 'Call link') + '</span>' +
        '<span class="call-page">on ' + esc(c.page || '/') + '</span>' +
        '<span class="call-when">' + fmtWhen(c.clickedAt) + '</span>' +
      '</div>';
    }).join('');
  }

  function leadMatches(l) {
    if (filter !== 'all' && l.status !== filter) return false;
    if (!query) return true;
    var hay = [l.name, l.phone, l.email, l.location, l.area, l.zip, l.projectType, l.message, l.notes]
      .join(' ').toLowerCase();
    return hay.indexOf(query) !== -1;
  }

  function toast(msg) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 3500);
  }

  /* ---------- projects manager ---------- */
  function loadProjects() {
    return api('/api/admin/projects').then(function (d) {
      projects = d.projects || [];
      renderList();
    });
  }

  function renderProjects() {
    if (openProject) { renderProjectDetail(); return; }
    var rows = projects.map(function (p, i) {
      return '<div class="proj-row" draggable="true" data-slug="' + esc(p.slug) + '" data-i="' + i + '">' +
        '<span class="proj-grip" aria-hidden="true">⋮⋮</span>' +
        '<img class="proj-thumb" src="' + esc(p.card) + '" alt="">' +
        '<span><div class="proj-name">' + esc(p.title) + '</div>' +
        '<div class="proj-meta">' + esc(p.type) + ' · ' + esc(p.area) + ' · ' + p.mediaCount + ' items</div></span>' +
        '<button type="button" class="proj-open" data-open-slug="' + esc(p.slug) + '">Edit media</button>' +
      '</div>';
    }).join('');
    $('lead-list').innerHTML =
      '<p class="drag-hint">Drag projects to reorder them — this sets the base order on the Our Work page (the page then mixes one per category). Changes save instantly; hit "Publish to Live Site" when you\'re done.</p>' + rows;
    wireDrag();
  }

  function wireDrag() {
    var container = $('lead-list');
    var dragEl = null;
    container.querySelectorAll('.proj-row').forEach(function (row) {
      row.addEventListener('dragstart', function () {
        dragEl = row;
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', function () {
        row.classList.remove('dragging');
        container.querySelectorAll('.proj-row').forEach(function (r) { r.classList.remove('drop-above', 'drop-below'); });
      });
      row.addEventListener('dragover', function (e) {
        e.preventDefault();
        if (row === dragEl) return;
        var rect = row.getBoundingClientRect();
        var above = e.clientY < rect.top + rect.height / 2;
        row.classList.toggle('drop-above', above);
        row.classList.toggle('drop-below', !above);
      });
      row.addEventListener('dragleave', function () {
        row.classList.remove('drop-above', 'drop-below');
      });
      row.addEventListener('drop', function (e) {
        e.preventDefault();
        if (!dragEl || row === dragEl) return;
        var rect = row.getBoundingClientRect();
        var above = e.clientY < rect.top + rect.height / 2;
        row.parentNode.insertBefore(dragEl, above ? row : row.nextSibling);
        row.classList.remove('drop-above', 'drop-below');
        var slugs = Array.prototype.map.call(container.querySelectorAll('.proj-row'), function (r) { return r.dataset.slug; });
        api('/api/admin/projects/reorder', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slugs: slugs })
        }).then(function (d) {
          if (d.ok) { toast('Order saved — pages rebuilding'); loadProjects(); }
          else toast('Reorder failed: ' + (d.error || ''));
        });
      });
    });
  }

  function renderProjectDetail() {
    var p = openProject;
    var featured = (p.card_img || p.hero_img)[0];
    var items = [{ src: p.hero_img[0], alt: p.hero_img[1], video: null }];
    p.gallery.forEach(function (it) {
      if (Array.isArray(it)) items.push({ src: it[0], alt: it[1], video: null });
      else items.push({ src: it.poster || '', alt: it.alt, video: it.video });
    });
    var tiles = items.map(function (it) {
      var key = it.video ? it.poster || it.src : it.src;
      var isFeatured = key === featured;
      return '<div class="media-tile">' +
        (it.video ? '<span class="vid-badge">VIDEO</span>' : '') +
        (isFeatured ? '<span class="feat-badge">FEATURED</span>' : '') +
        '<img src="' + esc(it.src) + '" alt="' + esc(it.alt) + '" loading="lazy">' +
        '<div class="tile-actions"><button type="button" data-feature="' + esc(key) + '"' + (isFeatured ? ' disabled' : '') + '>' +
        (isFeatured ? 'Featured image' : '★ Set as featured') + '</button></div>' +
      '</div>';
    }).join('');
    $('lead-list').innerHTML =
      '<div class="proj-detail-head">' +
        '<button type="button" class="back-btn" id="proj-back">← All projects</button>' +
        '<h2>' + esc(p.title) + '</h2>' +
        '<span class="proj-meta">' + esc(p.type) + ' · ' + esc(p.area) + '</span>' +
      '</div>' +
      '<div class="media-grid">' + tiles +
        '<button type="button" class="upload-tile" id="upload-tile"><span class="plus">+</span>Add photos or videos<br><small>jpg · png · heic · mp4 · mov</small></button>' +
        '<input type="file" id="upload-input" multiple accept=".jpg,.jpeg,.png,.heic,.webp,.mp4,.mov,image/*,video/mp4,video/quicktime" hidden>' +
      '</div>';

    $('proj-back').addEventListener('click', function () { openProject = null; renderList(); });
    $('upload-tile').addEventListener('click', function () { $('upload-input').click(); });
    $('upload-input').addEventListener('change', function (e) {
      uploadFiles(p.slug, Array.prototype.slice.call(e.target.files));
    });
    $('lead-list').querySelectorAll('[data-feature]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        api('/api/admin/projects/' + p.slug + '/featured', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ src: btn.dataset.feature })
        }).then(function (d) {
          if (d.ok) { toast('Featured image updated — pages rebuilding'); openDetail(p.slug); }
          else toast('Failed: ' + (d.error || ''));
        });
      });
    });
  }

  function uploadFiles(slug, files) {
    if (!files.length) return;
    var done = 0;
    toast('Uploading ' + files.length + ' file(s)…');
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        return fetch('/api/admin/projects/' + slug + '/media?filename=' + encodeURIComponent(file.name), {
          method: 'POST',
          body: file
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d.ok) done++;
          else toast(file.name + ': ' + (d.error || 'failed'));
        });
      });
    });
    chain.then(function () {
      toast(done + ' of ' + files.length + ' added — pages rebuilding');
      openDetail(slug);
      loadProjects();
    });
  }

  function openDetail(slug) {
    api('/api/admin/projects/' + slug).then(function (d) {
      if (d.ok) { openProject = d.project; renderList(); }
    });
  }

  function renderList() {
    if (filter === 'projects') { renderProjects(); return; }
    if (filter === 'calls') { renderCalls(); return; }
    var visible = leads.filter(leadMatches);
    if (!visible.length) {
      $('lead-list').innerHTML =
        '<div class="empty"><strong>No leads here yet</strong>' +
        (leads.length ? 'Try a different filter or search.' :
          'When someone fills out the Project Builder, contact form, or an area page form, it lands here instantly.') +
        '</div>';
      return;
    }
    $('lead-list').innerHTML = visible.map(function (l) {
      var quick = [l.projectType, l.budget, l.location || l.area || l.zip].filter(Boolean).join(' · ');
      var open = l.id === openId;
      var details = '';
      if (open) {
        var kv = Object.keys(FIELD_LABELS).map(function (k) {
          if (!l[k]) return '';
          var v = esc(l[k]);
          if (k === 'phone') v = '<a href="tel:' + v + '">' + v + '</a>';
          if (k === 'email') v = '<a href="mailto:' + v + '">' + v + '</a>';
          return '<div><div class="k">' + FIELD_LABELS[k] + '</div><div class="v">' + v + '</div></div>';
        }).join('');
        var notes = l.notes || l.message;
        details =
          '<div class="lead-body">' +
            '<div class="kv">' + kv + '</div>' +
            (notes ? '<div class="lead-notes">' + esc(notes) + '</div>' : '') +
            '<div class="lead-actions">' +
              '<button type="button" data-act="contacted" data-id="' + l.id + '">Mark Contacted</button>' +
              '<button type="button" data-act="won" data-id="' + l.id + '">Mark Won</button>' +
              '<button type="button" data-act="archived" data-id="' + l.id + '">Archive</button>' +
              '<button type="button" data-act="new" data-id="' + l.id + '">Mark New</button>' +
              '<button type="button" class="danger" data-act="delete" data-id="' + l.id + '">Delete</button>' +
            '</div>' +
          '</div>';
      }
      return '<div class="lead">' +
        '<div class="lead-head" data-open="' + l.id + '">' +
          '<span class="badge ' + esc(l.status) + '">' + esc(l.status) + '</span>' +
          '<span class="src">' + esc(SOURCE_LABELS[l.source] || l.source || '?') + '</span>' +
          '<span class="lead-name">' + esc(l.name || '(no name)') + '</span>' +
          '<span class="lead-quick">' + esc(quick) + '</span>' +
          '<span class="lead-when">' + fmtWhen(l.receivedAt) + '</span>' +
        '</div>' + details +
      '</div>';
    }).join('');
  }

  function render() { renderStats(); renderList(); }

  /* ---------- api ---------- */
  function api(url, opts) {
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) { showLogin(); throw new Error('unauthorized'); }
      return r.json();
    });
  }
  function load() {
    api('/api/admin/leads').then(function (d) {
      leads = d.leads || [];
      return api('/api/admin/calls');
    }).then(function (d) {
      calls = (d && d.calls) || [];
      showDash();
      render();
    }).catch(function () {});
  }

  /* ---------- views ---------- */
  function showLogin() {
    $('login-view').classList.remove('hidden');
    $('dash-view').classList.add('hidden');
  }
  function showDash() {
    $('login-view').classList.add('hidden');
    $('dash-view').classList.remove('hidden');
  }

  /* ---------- events ---------- */
  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: $('pw').value })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.ok) { $('pw').value = ''; $('login-error').textContent = ''; load(); }
      else { $('login-error').textContent = 'Wrong password — try again.'; }
    }).catch(function () { $('login-error').textContent = 'Server not reachable.'; });
  });

  $('logout-btn').addEventListener('click', function () {
    fetch('/api/admin/logout', { method: 'POST' }).then(showLogin);
  });
  $('refresh-btn').addEventListener('click', load);

  $('toolbar').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    filter = chip.dataset.f;
    openProject = null;
    document.querySelectorAll('.chip').forEach(function (c) {
      c.setAttribute('aria-pressed', String(c === chip));
    });
    renderList();
    if (filter === 'projects') loadProjects();
  });

  $('publish-btn').addEventListener('click', function () {
    var btn = $('publish-btn');
    btn.disabled = true;
    btn.textContent = 'Publishing…';
    api('/api/admin/publish', { method: 'POST' }).then(function (d) {
      toast(d.ok ? d.message : 'Publish failed: ' + (d.error || ''));
    }).catch(function () {
      toast('Publish failed — is the server running?');
    }).then(function () {
      btn.disabled = false;
      btn.textContent = 'Publish to Live Site';
    });
  });
  $('search').addEventListener('input', function (e) {
    query = e.target.value.trim().toLowerCase();
    renderList();
  });

  $('lead-list').addEventListener('click', function (e) {
    var openSlug = e.target.closest('[data-open-slug]');
    if (openSlug) { openDetail(openSlug.dataset.openSlug); return; }
    var actBtn = e.target.closest('[data-act]');
    if (actBtn) {
      var id = actBtn.dataset.id;
      if (actBtn.dataset.act === 'delete') {
        if (!window.confirm('Delete this lead permanently?')) return;
        api('/api/admin/leads/' + id, { method: 'DELETE' }).then(load);
      } else {
        api('/api/admin/leads/' + id, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: actBtn.dataset.act })
        }).then(load);
      }
      return;
    }
    var head = e.target.closest('[data-open]');
    if (head) {
      openId = openId === head.dataset.open ? null : head.dataset.open;
      renderList();
    }
  });

  /* auto-refresh every 60s while dashboard visible (not while managing projects) */
  setInterval(function () {
    if (!$('dash-view').classList.contains('hidden') && filter !== 'projects') load();
  }, 60000);

  load(); // if the session cookie is valid this goes straight to the dashboard
})();
</script>
</body>
</html>
